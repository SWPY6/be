# HTTP로 들어온 요청은 HTTPS로 보낸다.
# 단, 인증서 갱신 확인 경로만은 예외다. Let's Encrypt가 이 경로로 평문 접근해 도메인 소유를 확인하므로, 리다이렉트하면 갱신이 실패한다.
server {
    listen 80;
    server_name ploutosbe.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ploutosbe.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/ploutosbe.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ploutosbe.duckdns.org/privkey.pem;

    location / {
        # app은 도커 네트워크 안에만 존재하므로 서비스 이름으로 찾는다.
        proxy_pass http://app:8080;

        # 프록시를 거치면 앱이 보는 요청 정보가 전부 Nginx의 것이 된다.
        # 원래 요청자와 프로토콜을 헤더로 넘겨줘야 앱이 실제 주소를 알 수 있다.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
