name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치의 실행이 겹치지 않게 한다.
# PR은 오래된 실행을 취소해도 무방하지만, main은 배포가 중간에 끊기면
# 서버가 어중간한 상태로 남을 수 있으므로 취소하지 않고 순서대로 끝까지 실행한다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "26"

      - name: Gradle 캐시 설정
        uses: gradle/actions/setup-gradle@v4

      - name: 테스트 실행
        run: ./gradlew test

  deploy:
    # test job이 성공해야만 실행된다. PR에서는 배포하지 않고, main에 머지·push될 때만 배포한다.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: SSH 키 준비
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 서버의 호스트 키를 미리 등록해 접속 시 확인 절차에서 멈추지 않게 한다.
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: 서버에서 최신 코드로 재배포
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$EC2_USER@$EC2_HOST" '
            set -e
            cd ~/be
            git pull --ff-only
            docker compose up --build -d
          '
