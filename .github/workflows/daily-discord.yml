name: Daily Discord Digest

on:
  schedule:
    # 22:00 KST = 13:00 UTC (KST는 UTC+9, 서머타임 없음).
    # GitHub schedule은 고부하 시 지연될 수 있어 정시 도착을 보장하지 않는다.
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: 오늘 머지된 PR을 Discord로 전송
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          # KST 기준 오늘 날짜와, 그날 00:00(KST)에 해당하는 UTC 시각.
          # 출력 포맷이 gh의 mergedAt과 같아서 문자열 비교가 곧 시각 비교가 된다.
          KST_DATE=$(TZ=Asia/Seoul date +%F)
          SINCE=$(date -u -d "${KST_DATE} 00:00:00+09:00" +%Y-%m-%dT%H:%M:%SZ)
          echo "KST 날짜: ${KST_DATE} / 조회 시작(UTC): ${SINCE}"

          # --search를 쓰면 검색 인덱스 반영 지연으로 방금 머지된 PR이 누락될 수 있다.
          # --state/--base만 쓰면 GraphQL 직접 조회라 지연이 없다. 날짜 필터는 jq가 한다.
          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main --limit 100 \
            --json number,title,author,mergedAt,url > prs.json

          # payload는 반드시 jq가 만든다. 문자열을 손으로 이어붙이면
          # 제목의 따옴표·백슬래시·줄바꿈·이모지에서 JSON이 깨진다.
          # gh의 정렬은 생성일 내림차순이므로 mergedAt으로 다시 정렬한다.
          # URL을 <>로 감싸 Discord가 PR마다 미리보기 카드를 붙이지 않게 한다.
          #
          # Discord content는 2000자가 한계다. 잘라서 버리는 대신 줄 단위로
          # 1880자씩 묶어 여러 메시지로 나눈다(꼬리에 붙는 페이지 표시분 여유).
          # 한 줄은 제목 80자 clip 덕에 한도를 넘지 못하므로 어떤 입력에도 안전하다.
          # payload 하나당 한 줄(JSONL)로 쓴다.
          jq -c --arg date "$KST_DATE" --arg since "$SINCE" '
            def clip($n): if (. | length) > $n then .[:$n] + "…" else . end;
            { "Aleexender": "김정훈", "dongkdc": "김동찬", "kyerimrim": "김예림" } as $names
            | ["Aleexender", "dongkdc", "kyerimrim"] as $team
            | (map(select(.mergedAt >= $since)) | sort_by(.mergedAt)) as $prs
            | ($prs | length) as $n
            # 팀원 3명은 0건이어도 항상 보여주고, 그 외 기여자는 뒤에 덧붙인다.
            | ($team + ($prs | map(.author.login // "ghost") | unique
                        | map(select(. as $l | $team | index($l) | not)))) as $logins
            # 사람별 섹션을 줄 배열로 평탄화한다(섹션 사이 빈 줄 포함).
            | ($logins | map(
                . as $login
                | ($prs | map(select((.author.login // "ghost") == $login))) as $mine
                | ["**\($names[$login] // $login)** (\($mine | length)건)"]
                  + ($mine | map("• [#\(.number)](<\(.url)>) \(.title | clip(80))"))
                  + [""]
              ) | add | .[0:-1]) as $body
            | (["📅 **\($date)** 데일리 — main 머지 \($n)건", ""] + $body) as $lines
            | (reduce $lines[] as $l ([[]];
                if ((.[-1] | join("\n") | length) + 1 + ($l | length)) <= 1880
                then (.[0:-1] + [.[-1] + [$l]])
                else (. + [[$l]])
                end
              ) | map(join("\n"))) as $chunks
            # 대량 머지·봇 폭주로 채널이 도배되는 것만 막는다. 5개 ≈ PR 120건.
            | (if ($chunks | length) > 5
               then ($chunks[0:5] | (.[4] |= . + "\n… 이하 생략"))
               else $chunks
               end) as $pages
            | ($pages | length) as $total
            | $pages
            | to_entries[]
            | { content: (.value + (if $total > 1 then "\n(\(.key + 1)/\($total))" else "" end)) }
          ' prs.json > payloads.jsonl
          cat payloads.jsonl

          # 4xx/5xx면 응답 본문을 로그에 남기고 워크플로를 실패시킨다.
          # 조용히 성공하면 알림이 끊긴 걸 며칠 뒤에나 알게 된다.
          # 메시지 사이 sleep은 웹훅 레이트리밋(채널당 5회/5초)을 피하려는 것이다.
          TOTAL=$(wc -l < payloads.jsonl)
          echo "전송할 메시지: ${TOTAL}건"
          SENT=0
          while IFS= read -r payload; do
            SENT=$((SENT + 1))
            printf '%s' "$payload" | curl --silent --show-error --fail-with-body \
              -H "Content-Type: application/json" \
              --data-binary @- \
              "$DISCORD_WEBHOOK_URL"
            if [ "$SENT" -lt "$TOTAL" ]; then sleep 1; fi
          done < payloads.jsonl
