spring.application.name=ploutos

spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 테스트는 실제 KIS를 호출하지 않는다. 설정 바인딩만 통과시키기 위한 더미 값.
ploutos.kis.base-url=https://kis.test
ploutos.kis.app-key=test-app-key
ploutos.kis.app-secret=test-app-secret
