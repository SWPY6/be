spring.application.name=ploutos

# Nginx 뒤에서 동작하므로 원래 요청의 프로토콜·호스트를 X-Forwarded-* 헤더에서 읽는다.
# 없으면 앱이 자기 주소를 http://app:8080 으로 인식해 리다이렉트·Swagger 주소가 깨진다.
server.forward-headers-strategy=framework

# MySQL
spring.datasource.url=jdbc:mysql://mysql:3306/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis (현재가 캐시). 로컬 bootRun은 docker compose의 redis(localhost:6379)에 붙는다.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# KIS(한국투자증권) Open API. 값이 없으면 기동에 실패한다.
# 도메인은 앱키 종류와 짝이 맞아야 한다 — 모의투자 키로 실전 도메인을 호출하면 일부 API가 거부된다.
# 실전으로 전환할 때는 KIS_BASE_URL=https://openapi.koreainvestment.com:9443
ploutos.kis.base-url=${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
ploutos.kis.app-key=${KIS_APP_KEY}
ploutos.kis.app-secret=${KIS_APP_SECRET}

# 현재가 캐시. 최근 조회된 종목(활성 창 안)만 갱신 주기마다 KIS에서 받아 채운다.
# 값 TTL은 갱신 주기보다 길어야 한다. KIS 호출 상한 ≈ 활성 종목 수 / 갱신 주기.
ploutos.quote.cache-ttl-seconds=30
ploutos.quote.refresh-interval-seconds=10
ploutos.quote.active-window-seconds=60

# NAVER API HUB 뉴스 검색. 값이 없으면 기동에 실패한다. 주소와 인증 헤더는 API HUB 전용 한 세트다.
ploutos.naver.base-url=${NAVER_API_HUB_BASE_URL:https://naverapihub.apigw.ntruss.com}
ploutos.naver.client-id=${NAVER_API_HUB_CLIENT_ID}
ploutos.naver.client-secret=${NAVER_API_HUB_CLIENT_SECRET}

# 뉴스 캐시와 일일 호출 상한. 검색 API 하루 한도 25,000회의 80%에서 멈춘다(재시도 포함).
ploutos.news.cache-ttl-seconds=600
ploutos.news.daily-call-limit=20000

# 산업 흐름 갱신. 조절 장치는 초당 호출 수 하나이고, 한 바퀴(= 갱신 주기)는
# 대상 종목 수 / 이 값으로 정해진다.
#
# 현재 앱키는 모의투자용이고 모의투자 한도는 초당 2건이다(실측). 이 예산을 현재가 갱신·
# 사용자 요청과 나눠 써야 하므로 1로 둔다. 900종목이면 한 바퀴 15분이다.
# 실전 키로 바꾸면 한도가 초당 20건이 되므로 3(=15%)으로 올린다.
# 환경변수 PLOUTOS_INDUSTRYFLOW_CALLSPERSECOND 로 재배포 없이 조절할 수 있다.
ploutos.industry-flow.calls-per-second=1

# 스케줄러 스레드. QuoteRefresher와 산업 흐름 갱신이 서로를 기다리지 않게 2개가 필요하다.
# 1개면 산업 흐름이 스레드를 쥔 동안 현재가 갱신이 밀려, 사용자가 보는 종목의 캐시가
# TTL을 넘겨 비어버린다. 오류 없이 "갱신이 늦어지는" 형태로만 나타나 발견하기 어렵다.
spring.task.scheduling.pool.size=2
