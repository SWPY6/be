spring.application.name=ploutos

# Nginx 뒤에서 동작하므로 원래 요청의 프로토콜·호스트를 X-Forwarded-* 헤더에서 읽는다.
# 없으면 앱이 자기 주소를 http://app:8080 으로 인식해 리다이렉트·Swagger 주소가 깨진다.
server.forward-headers-strategy=framework

# MySQL. 기본값은 로컬 실행용(docker compose의 mysql이 3301로 열려 있다).
# 컨테이너로 돌 때는 docker compose가 SPRING_DATASOURCE_URL로 mysql:3306을 덮어쓴다.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3301}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Redis (현재가 캐시). 로컬 bootRun은 docker compose의 redis(localhost:6379)에 붙는다.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# KIS(한국투자증권) Open API. 값이 없으면 기동에 실패한다.
# 도메인은 앱키 종류와 짝이 맞아야 한다 — 모의투자 키로 실전 도메인을 호출하면 일부 API가 거부된다.
# 실전으로 전환할 때는 KIS_BASE_URL=https://openapi.koreainvestment.com:9443
ploutos.kis.base-url=${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
ploutos.kis.app-key=${KIS_APP_KEY}
ploutos.kis.app-secret=${KIS_APP_SECRET}

# 현재가 캐시. 최근 조회된 종목(활성 창 안)만 갱신 주기마다 KIS에서 받아 채운다.
# 값 TTL은 갱신 주기보다 길어야 한다. KIS 호출 상한 ≈ 활성 종목 수 / 갱신 주기.
ploutos.quote.cache-ttl-seconds=30
ploutos.quote.refresh-interval-seconds=10
ploutos.quote.active-window-seconds=60

# 시장 지표 현재값 캐시. 지표가 5개로 고정이라 갱신 스케줄러 없이 캐시가 비었을 때만 KIS를 부른다.
# KIS 호출 상한 = 지표 수 / TTL.
ploutos.market-quote.cache-ttl-seconds=10

# 산업 흐름 갱신. 조절 장치는 초당 호출 수 하나이고, 한 바퀴(= 갱신 주기)는
# 대상 종목 수 / 이 값으로 정해진다.
#
# 현재 앱키는 모의투자용이고 모의투자 한도는 초당 2건이다(실측). 이 예산을 현재가 갱신·
# 사용자 요청과 나눠 써야 하므로 1로 둔다. 900종목이면 한 바퀴 15분이다.
# 실전 키로 바꾸면 한도가 초당 20건이 되므로 3(=15%)으로 올린다.
# 환경변수 PLOUTOS_INDUSTRYFLOW_CALLSPERSECOND 로 재배포 없이 조절할 수 있다.
ploutos.industry-flow.calls-per-second=1

# 스케줄러 스레드. QuoteRefresher와 산업 흐름 갱신이 서로를 기다리지 않게 2개가 필요하다.
# 1개면 산업 흐름이 스레드를 쥔 동안 현재가 갱신이 밀려, 사용자가 보는 종목의 캐시가
# TTL을 넘겨 비어버린다. 오류 없이 "갱신이 늦어지는" 형태로만 나타나 발견하기 어렵다.
spring.task.scheduling.pool.size=2

# Open DART 공시검색·고유번호. 키가 없으면 기동에 실패한다. 키는 요청 쿼리(crtfc_key)에 실리므로 URL을 로그에 남기지 않는다.
ploutos.dart.base-url=${DART_BASE_URL:https://opendart.fss.or.kr}
ploutos.dart.api-key=${DART_API_KEY}

# 공시 캐시와 일일 호출 상한. 공식 안내 한도 20,000회의 80%에서 멈춘다(재시도·고유번호 파일 포함).
# 공시검색은 그보다 낮은 상한에서 멈춰 남은 몫을 법인 매핑 갱신(고유번호 파일)에 남긴다.
# 계정의 실제 한도는 운영 전에 확인한다. SEC는 초당 상한(SEC 10건의 절반, 서버 합산)을 따로 둔다.
# 법인 매핑(DART 고유번호·SEC 티커 파일)은 이 주기마다 다시 받는다.
ploutos.disclosure.cache-ttl-seconds=600
ploutos.disclosure.daily-call-limit=16000
ploutos.disclosure.daily-search-call-limit=15000
ploutos.disclosure.sec-calls-per-second=5
ploutos.disclosure.issuer-code-refresh-hours=24

# SEC EDGAR 공시 목록·티커 파일. API 키는 없고, SEC 요구대로 모든 요청에 "서비스명 연락이메일" User-Agent를 보낸다.
# 값이 없거나 이메일이 없으면 기동에 실패한다.
ploutos.sec.user-agent=${SEC_USER_AGENT}
ploutos.sec.data-base-url=${SEC_DATA_BASE_URL:https://data.sec.gov}
ploutos.sec.www-base-url=${SEC_WWW_BASE_URL:https://www.sec.gov}
